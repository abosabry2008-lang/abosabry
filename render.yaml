# ---------------------------------------------------------------------------
# Render blueprint: ERP (API + Flutter web) on Render, PostgreSQL on Neon
# https://render.com/docs/blueprint-spec
#
# بالعربي
#   الملف ده بيتربط بالريبو على GitHub، وRender يبني منه اتنين سيرفس:
#     1. erp-api  → الـ REST API (Node.js)   ← هنا هتلزق DATABASE_URL بتاع Neon
#     2. erp-web  → موقع Flutter Web (ملفات ثابتة جاهزة مبنية مسبقاً)
#   في Render: New + → Blueprint → اختار الريبو → Apply.
#   قاعدة البيانات (PostgreSQL) بتتعمل على Neon مجاناً: https://neon.tech
# ---------------------------------------------------------------------------

services:
  # ---------------------------- 1. REST API ----------------------------
  - type: web
    name: erp-api
    runtime: node
    rootDir: erp/backend
    region: frankfurt          # أقرب منطقة لمصر/الشرق الأوسط
    plan: free

    # Build: install → generate Prisma client → compile TypeScript → sync schema
    # (--include=dev because NODE_ENV=production would otherwise skip TypeScript,
    #  the Prisma CLI and the seed script)
    buildCommand: npm install --include=dev && npx prisma generate && npm run build && npx prisma db push --skip-generate
    startCommand: npm start
    healthCheckPath: /api/v1/health

    envVars:
      - key: NODE_ENV
        value: production

      # ← Neon connection string. Render will ask for it when you create the
      #   Blueprint; paste the value Neon gives you (it already ends with
      #   ?sslmode=require). Example:
      #   postgresql://erp_owner:AbC123@ep-cool-name-123456.eu-central-1.aws.neon.tech/erp?sslmode=require
      - key: DATABASE_URL
        sync: false

      # JWT signing secrets — Render generates a random value for each.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

      # Only the Flutter site may call the API from a browser.
      # If this reference fails to resolve, set it by hand to the erp-web URL.
      - key: CORS_ORIGIN
        fromService:
          name: erp-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  # ------------------------- 2. Flutter web ---------------------------
  - type: web
    name: erp-web
    runtime: static
    region: frankfurt
    # The compiled Flutter web app is committed under erp/web
    # (see erp/deploy/build_web.ps1). No build step on Render.
    staticPublishPath: ./erp/web
    buildCommand: "echo 'static files are committed under erp/web'"
    buildFilter:
      paths:
        - erp/web/**

    headers:
      - path: /index.html
        name: Cache-Control
        value: no-cache

    # Single-page-app fallback: unknown paths serve the Flutter shell.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# ---------------------------------------------------------------------------
# Optional: use Render's own PostgreSQL instead of Neon by uncommenting the
# block below and pointing DATABASE_URL at it:
#   DATABASE_URL:
#     fromDatabase:
#       name: erp-db
#       property: connectionString
# ---------------------------------------------------------------------------
# databases:
#   - name: erp-db
#     databaseName: erp
#     user: erp
#     region: frankfurt
#     plan: free
